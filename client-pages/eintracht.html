<style>
:root{
  --c-white:#ffffff; --c-off-white:#fdfdfd; --c-off-black:#181818; --c-black-blue:#030712;
  --c-blue:#0013e9; --c-dark-blue:#000eaf; --c-neon:#c6ff00;
  --c-grey-100:#f3f4f6; --c-grey-200:#e6e6e6; --c-grey-300:#a0a0a0; --c-grey-400:#646464;
  --c-error:#dc2626;
  --o-black-5:#1818180d; --o-black-10:#1818181a; --o-black-20:#18181833; --o-black-50:#18181880; --o-black-80:#181818cc;
  --o-white-5:#fdfdfd0d; --o-white-10:#fdfdfd1a; --o-white-15:#fdfdfd26; --o-white-40:#fdfdfd66; --o-white-80:#fdfdfdcc;
  --sans:"Instrument Sans","Untitled Sans",Arial,sans-serif;
  --h1:4rem; --h2:3rem; --h3:2rem; --h4:1.5rem;
  --t-large:1.25rem; --t-medium:1.125rem; --t-small:.875rem; --t-tiny:.75rem;
  --gutter:clamp(16px,5vw,4rem); --container:76rem;
  --r-sm:4px; --r-md:6px; --r-round:99px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --bg:var(--c-off-white); --text:var(--c-off-black); --text-2:var(--o-black-80); --text-3:var(--o-black-50);
  --border:var(--c-grey-200); --fill:var(--o-black-5); --fill-hi:var(--o-black-10);
  --barh:3.5rem;
}
@media (max-width:900px){ :root{--h1:2.75rem; --h2:2.25rem; --h3:1.625rem} }
@media (max-width:520px){ :root{--h1:2.25rem; --h2:1.875rem} }
.inv{
  background:linear-gradient(135deg,var(--c-blue) 35%,var(--c-dark-blue)); --bg:var(--c-blue);
  --text:var(--c-white); --text-2:var(--o-white-80); --text-3:#ffffffa6;
  --border:#ffffff33; --fill:#ffffff1a; --fill-hi:#ffffff2e; color:var(--text);
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:clamp(14px,13px + .2vw,16px); scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{margin:0; background:var(--c-off-white); color:var(--c-off-black); font-family:var(--sans);
  font-weight:400; font-size:var(--t-medium); line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:400; letter-spacing:-.04em; line-height:1.05; margin:0}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit; color:inherit}
.wrap{max-width:var(--container); margin-inline:auto; padding-inline:var(--gutter)}
.eyebrow{display:inline-block; font-size:var(--t-small); color:var(--text-3); letter-spacing:.02em; margin-bottom:1rem}
.h1{font-size:var(--h1)} .h2{font-size:var(--h2)} .h3{font-size:var(--h3)} .h4{font-size:var(--h4)}
.lead{font-size:var(--t-large); color:var(--text-2); max-width:44rem; margin-top:1.25rem}
.copy{color:var(--text-2)}
.small{font-size:var(--t-small); color:var(--text-3)}
.btn{display:inline-flex; align-items:center; gap:.5rem; padding:.8rem 1.25rem; border-radius:var(--r-round);
  background:var(--c-blue); color:var(--c-white); border:0; text-decoration:none; cursor:pointer;
  font-size:var(--t-regular,1rem); transition:background .2s var(--ease)}
.btn:hover{background:var(--c-dark-blue)}
.btn--ghost{background:var(--fill); color:var(--text); border:1px solid var(--border)}
.btn--ghost:hover{background:var(--fill-hi)}
.btn--white{background:var(--c-white); color:var(--c-blue)}
.btn--white:hover{background:var(--c-grey-100)}
.tag{display:inline-block; padding:.25rem .6rem; border-radius:var(--r-round); border:1px solid var(--border);
  font-size:var(--t-tiny); color:var(--text-2); white-space:nowrap}

/* ---- gate ------------------------------------------------------------ */
.gate{min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:var(--gutter)}
.gate-box{width:min(26rem,100%)}
.gate-logo{display:block; margin-bottom:3rem; color:var(--c-blue)}
.gate-logo svg{height:1.75rem; width:auto; display:block}
.gate h1{font-size:var(--h3); margin-bottom:.75rem}
.gate form{display:flex; gap:.5rem; margin-top:2rem}
.gate input{flex:1; min-width:0; padding:.8rem 1.25rem; border-radius:var(--r-round); border:1px solid transparent;
  background:var(--c-grey-100); outline:none; font-size:16px}
.gate input:focus{border-color:var(--c-blue)}
.gate-msg{margin-top:1rem; min-height:1.5em; font-size:var(--t-small); color:var(--text-3)}
.gate-msg.err{color:var(--c-error)}
[hidden]{display:none!important}

/* ---- top bar and section nav ------------------------------------------ */
.bar{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--c-off-white) 88%,transparent);
  -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); border-bottom:1px solid var(--c-grey-200)}
.bar-in{display:flex; align-items:center; gap:1rem; height:var(--barh)}
.bar-logo{color:var(--c-blue); flex:none}
.bar-logo svg{height:1.15rem; width:auto; display:block}
.bar-x{color:var(--text-3); font-size:var(--t-small)}
.bar-client{font-size:var(--t-small); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .btn{margin-left:auto; padding:.5rem 1rem; font-size:var(--t-small)}
.snav{display:flex; gap:.25rem; overflow-x:auto; scrollbar-width:none; padding-bottom:.6rem; -webkit-overflow-scrolling:touch}
.snav::-webkit-scrollbar{display:none}
.snav a{flex:none; text-decoration:none; font-size:var(--t-small); color:var(--text-2); padding:.35rem .8rem;
  border-radius:var(--r-round); transition:background .2s var(--ease),color .2s var(--ease)}
.snav a:hover{background:var(--fill)}
.snav a.on{background:var(--c-blue); color:var(--c-white)}
.snav a .n{color:var(--text-3); margin-right:.35rem}
.snav a.on .n{color:var(--o-white-80)}

/* ---- sections ----------------------------------------------------------- */
.sec{padding-block:clamp(2rem,4.5vw,3.5rem); scroll-margin-top:calc(var(--barh) + 2.5rem)}
.sec--grey{background:var(--c-off-white)}
.sec-hd{margin-bottom:clamp(1.25rem,3vw,2rem)}
.num{display:inline-flex; align-items:center; gap:.5rem; font-size:var(--t-small); color:var(--text-3); margin-bottom:1rem}
.num b{font-weight:400; color:var(--c-blue)}
.inv .num b{color:var(--c-white)}

.hero .h1{max-width:18ch}
.hero-meta{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:2rem}
/* Same header as the site's research page: full-bleed photo (supply it
   already in black and white, so club colours can be kept in it), a bottom-heavy scrim, the copy pinned to the bottom-left corner. */
.hero--photo{position:relative; overflow:hidden; min-height:82vh; min-height:82dvh; display:flex; flex-direction:column;
  background:var(--c-off-black); color:var(--c-white)}
.hero--photo .hero-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 35%;
  opacity:0; transition:opacity .6s var(--ease)}
.hero--photo .hero-bg.in{opacity:1}
.hero-bg-ph{position:absolute; inset:0; display:grid; place-items:center; color:var(--o-white-80)}
.hero-bg-ph .ph{color:var(--c-white); font-size:var(--t-large)}
.hero-scrim{position:absolute; inset:0; background:linear-gradient(to top, rgba(3,7,18,.88), rgba(3,7,18,.45) 35%, rgba(3,7,18,.12) 65%, rgba(3,7,18,.25))}
.hero--photo .wrap{position:relative; z-index:1; flex:1 1 auto; width:100%; display:flex; flex-direction:column; justify-content:flex-end;
  padding-top:4rem; padding-bottom:clamp(2rem,5vw,4rem)}
.hero-copy{display:flex; flex-direction:column; gap:1.25rem; max-width:min(46rem,100%)}
.hero-copy .eyebrow{color:var(--o-white-80); margin:0}
/* A placeholder still to be filled from the call: visible on purpose, so it
   is not sent by accident. */
.ph{display:inline-block; padding:0 .3em; border:1.5px dashed currentColor; border-radius:12px; color:var(--c-blue); opacity:.9}
.hero-title .ph{color:var(--c-white)}
.hero-title{font-size:var(--h1); line-height:1.05; letter-spacing:-.04em; color:var(--c-white); text-wrap:balance}
.hero-lead{font-size:var(--t-large); color:var(--o-white-80); max-width:min(52ch,100%)}
.sec--journey{padding-bottom:0}
.sec--journey .journey a{background:var(--c-grey-100)}
.sec--journey .journey a:hover{background:var(--c-grey-200)}
.sec--journey .journey .k{color:var(--c-blue)}
.sec--journey .journey .d{color:var(--text-3)}
.hero-panel{margin-top:clamp(2.5rem,6vw,4rem); border-radius:28px; padding:clamp(1.25rem,4vw,3rem);
  display:flex; flex-direction:column; justify-content:space-between; gap:clamp(2rem,6vw,5rem); min-height:clamp(16rem,32vw,24rem)}
.hero-panel .claim{font-size:var(--h3); letter-spacing:-.04em; line-height:1.1; max-width:20ch}
.journey{display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem}

  transition:background .2s var(--ease)}
.journey a:hover{background:var(--fill-hi)}
.journey .k{font-size:var(--t-tiny); color:var(--text-3)}
.journey .t{font-size:var(--t-large); letter-spacing:-.02em}
.journey .d{font-size:var(--t-small); color:var(--text-3)}
@media (max-width:760px){ .journey{grid-template-columns:1fr 1fr} }

.grid{display:grid; gap:1rem}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){ .g3,.g4{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .g2,.g3,.g4{grid-template-columns:1fr} }
.card{background:var(--c-grey-100); border:0; border-radius:24px; padding:1.75rem;
  display:flex; flex-direction:column; gap:.75rem}
.inv .card{background:var(--fill)}
.card .k{font-size:var(--t-tiny); color:var(--text-3); letter-spacing:.02em}
.card h3{font-size:var(--t-large); letter-spacing:-.02em; line-height:1.25}
.card p{font-size:var(--t-small); color:var(--text-2)}
.card .tags{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:auto; padding-top:.5rem}
.card--blue{background:linear-gradient(135deg,var(--c-blue) 35%,var(--c-dark-blue)); color:var(--c-white)}
.card--blue p,.card--blue .k{color:var(--o-white-80)}
.card--blue .tag{border-color:var(--o-white-40); color:var(--c-white)}

/* use cases: expandable */
.uc{border-top:1px solid var(--border)}
.uc details{border-bottom:1px solid var(--border)}
.uc summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:3rem 1fr auto; gap:1rem;
  align-items:baseline; padding:1.5rem 0}
.uc summary::-webkit-details-marker{display:none}
.uc .n{font-size:var(--t-small); color:var(--c-blue)}
.uc .q{font-size:var(--h4); letter-spacing:-.03em; line-height:1.2}
.uc .pl{width:1.75rem; height:1.75rem; border-radius:50%; border:1px solid var(--border); display:grid; place-items:center;
  transition:transform .25s var(--ease); font-size:1.1rem; line-height:1}
.uc details[open] .pl{transform:rotate(45deg); background:var(--c-blue); color:var(--c-white); border-color:var(--c-blue)}
.uc-body{display:grid; grid-template-columns:3rem 1fr 1fr; gap:1rem 2rem; padding:0 0 2rem}
.uc-body > :first-child{grid-column:2}
.uc-body dl{margin:0; display:grid; gap:1rem}
.uc-body dt{font-size:var(--t-tiny); color:var(--text-3); margin-bottom:.2rem}
.uc-body dd{margin:0; font-size:var(--t-small); color:var(--text-2)}
.uc-body p{color:var(--text-2)}
@media (max-width:760px){
  .uc summary{grid-template-columns:2rem 1fr auto}
  .uc-body{grid-template-columns:1fr; padding-left:3rem}
  .uc-body > :first-child{grid-column:auto}
}

/* people */
.ppl{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem}
@media (max-width:900px){ .ppl{grid-template-columns:repeat(2,1fr)} }
@media (max-width:520px){ .ppl{grid-template-columns:1fr} }
.person{display:flex; gap:1rem; align-items:flex-start; padding:1.5rem; border-radius:24px; background:var(--c-grey-100)}
.av{flex:none; width:2.75rem; height:2.75rem; border-radius:50%; display:grid; place-items:center; font-size:var(--t-small);
  background:var(--c-white); color:var(--text-2)}
.person--us .av{background:var(--c-blue); color:var(--c-white)}
.person b{display:block; font-weight:400}
.person .r{font-size:var(--t-small); color:var(--text-3)}
.person .g{font-size:var(--t-small); color:var(--text-2); margin-top:.5rem}
.sub-hd{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin:2rem 0 1rem; flex-wrap:wrap}
.sub-hd:first-child{margin-top:0}
.sub-hd h3{font-size:var(--h4)}

/* integrations */
.flow{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:1rem; align-items:stretch}
.flow .arrow{align-self:center; color:var(--text-3); font-size:1.5rem}
@media (max-width:900px){ .flow{grid-template-columns:1fr} .flow .arrow{transform:rotate(90deg); justify-self:center} }
.chips{display:flex; flex-wrap:wrap; gap:.4rem}
.chip{padding:.35rem .75rem; border-radius:var(--r-round); background:var(--c-white); font-size:var(--t-small)}
.chip--q{background:transparent; border:1px dashed var(--c-grey-300); color:var(--text-3)}

/* calculator */
.calc{display:grid; grid-template-columns:1.25fr 1fr; gap:1.5rem; align-items:start}
@media (max-width:1000px){ .calc{grid-template-columns:1fr} }
.panel{background:var(--c-grey-100); border-radius:24px; padding:clamp(1.25rem,3vw,2rem)}
.panel + .panel{margin-top:1rem}
.lbl{display:flex; justify-content:space-between; gap:1rem; font-size:var(--t-small); color:var(--text-3); margin-bottom:.75rem}
.lbl output{color:var(--text)}
.pkgs{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem}
@media (max-width:520px){ .pkgs{grid-template-columns:1fr} }
.pkg{text-align:left; padding:1rem; border-radius:16px; border:1.5px solid transparent; background:var(--c-white); cursor:pointer;
  display:flex; flex-direction:column; gap:.25rem; transition:border-color .2s var(--ease),background .2s var(--ease)}
.pkg:hover{border-color:var(--c-grey-300)}
.pkg[aria-pressed="true"]{border-color:var(--c-blue)}
.pkg .pn{font-size:var(--t-large); letter-spacing:-.02em}
.pkg .pp{color:var(--c-blue)}
.pkg .pd{font-size:var(--t-tiny); color:var(--text-3)}
input[type=range]{width:100%; accent-color:var(--c-blue); height:1.75rem}
.inv input[type=range]{accent-color:var(--c-white)}
.squad{display:grid; gap:1rem}
.squad-pos{font-size:var(--t-tiny); color:var(--text-3); margin-bottom:.4rem}
.squad-row{display:flex; flex-wrap:wrap; gap:.35rem}
.pl-chip{display:inline-flex; align-items:center; gap:.4rem; padding:.4rem .7rem; border-radius:var(--r-round);
  border:1px solid var(--border); background:var(--c-white); cursor:pointer; font-size:var(--t-small);
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.pl-chip .no{font-size:var(--t-tiny); color:var(--text-3); min-width:1.2em}
.pl-chip[aria-pressed="true"]{background:var(--c-blue); border-color:var(--c-blue); color:var(--c-white)}
.pl-chip[aria-pressed="true"] .no{color:var(--o-white-80)}
.squad-tools{display:flex; gap:.5rem; flex-wrap:wrap}
.squad-tools button{padding:.35rem .8rem; font-size:var(--t-small)}
.seg{display:inline-flex; flex-wrap:wrap; gap:.35rem}
.seg button{padding:.4rem .8rem; border-radius:var(--r-round); border:1px solid transparent; background:var(--c-white);
  cursor:pointer; font-size:var(--t-small)}
.seg button[aria-pressed="true"]{border-color:var(--c-blue); color:var(--c-blue)}
.out{position:sticky; top:calc(var(--barh) + 3.5rem)}
@media (max-width:1000px){ .out{position:static} }
.bar .btn{white-space:nowrap}
.bar .btn .short{display:none}
@media (max-width:520px){ .bar .btn .long{display:none} .bar .btn .short{display:inline} .bar-client{font-size:var(--t-tiny)} }
.out .inv{border-radius:28px; padding:clamp(1.5rem,3vw,2.25rem)}
.big{font-size:clamp(2.5rem,6vw,3.75rem); letter-spacing:-.04em; line-height:1}
.out-row{display:flex; justify-content:space-between; gap:1rem; padding:.75rem 0; border-top:1px solid var(--border);
  font-size:var(--t-small); color:var(--text-2)}
.out-row b{font-weight:400; color:var(--text); text-align:right}
.meter{height:.5rem; border-radius:var(--r-round); background:var(--fill-hi); overflow:hidden; margin:.75rem 0 .5rem}
.meter i{display:block; height:100%; background:var(--c-white); border-radius:inherit; transition:width .3s var(--ease)}
.punch{margin-top:1.25rem; padding:1.25rem; border-radius:20px; background:var(--c-white); color:var(--c-blue);
  font-size:var(--t-medium); line-height:1.35}
.fine{font-size:var(--t-tiny); color:var(--text-3); margin-top:1rem; line-height:1.5}

/* comparison */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:24px; background:var(--c-grey-100)}
table.cmp{border-collapse:collapse; width:100%; min-width:30rem; font-size:var(--t-small)}
.cmp th,.cmp td{text-align:left; vertical-align:top; padding:1rem; border-bottom:1px solid var(--border); font-weight:400}
.cmp thead th{font-size:var(--t-medium); letter-spacing:-.02em}
.cmp tbody th{color:var(--text-3); width:18%}
.cmp td{color:var(--text-2)}
.cmp .us{background:color-mix(in srgb,var(--c-blue) 7%,white); color:var(--text)}
.cmp thead .us{background:var(--c-blue); color:var(--c-white)}
.cmp thead .us .small{color:var(--o-white-80)}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}

/* steps */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; counter-reset:s}
@media (max-width:1000px){ .steps{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .steps{grid-template-columns:1fr} }
.steps5{display:grid; grid-template-columns:repeat(5,1fr); gap:1rem}
@media (max-width:1000px){ .steps5{grid-template-columns:repeat(3,1fr)} }
@media (max-width:640px){ .steps5{grid-template-columns:1fr} }
.step{border-top:2px solid var(--c-blue); padding-top:1rem}
.step .w{font-size:var(--t-tiny); color:var(--c-blue)}
.step h3{font-size:var(--t-large); letter-spacing:-.02em; margin:.4rem 0 .5rem}
.step p{font-size:var(--t-small); color:var(--text-2)}

/* downloads */
.dl{display:flex; align-items:center; gap:1.25rem; padding:1.25rem 1.5rem; border-radius:24px; background:var(--c-grey-100);
  border:1.5px solid transparent; text-align:left; width:100%; cursor:pointer; text-decoration:none; transition:border-color .2s var(--ease)}
.dl:hover{border-color:var(--c-blue)}
.dl .ic{flex:none; width:2.75rem; height:3.25rem; border-radius:10px; background:linear-gradient(135deg,var(--c-blue) 35%,var(--c-dark-blue)); color:var(--c-white);
  display:grid; place-items:end center; padding-bottom:.4rem; font-size:.65rem; letter-spacing:.06em}
.dl b{display:block; font-weight:400; font-size:var(--t-large); letter-spacing:-.02em}
.dl span.s{font-size:var(--t-small); color:var(--text-3)}
.dl .go{margin-left:auto; color:var(--c-blue); flex:none}

/* faq */
.faq details{border-top:1px solid var(--border)}
.faq details:last-child{border-bottom:1px solid var(--border)}
.faq summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:1rem; padding:1.25rem 0;
  font-size:var(--t-large); letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; color:var(--text-3); transition:transform .25s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details > div{padding:0 0 1.5rem; color:var(--text-2); max-width:48rem}

.cta-box{border-radius:28px; padding:clamp(1.75rem,5vw,4rem)}
.cta{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:2rem}
.foot{padding-block:2rem; font-size:var(--t-tiny); color:var(--text-3); display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between}
.foot button{background:none; border:0; padding:0; color:inherit; text-decoration:underline; cursor:pointer; font-size:inherit}

/* reveal */
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0; transform:translateY(14px); transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .rv.in{opacity:1; transform:none}
}

/* ---- printable documents ----------------------------------------------- */
.doc{display:none}
@media print{
  @page{size:A4; margin:16mm 16mm 18mm}
  body{background:#fff; font-size:10.5pt}
  body.print-doc > *{display:none!important}
  body.print-doc > #app{display:block!important}
  body.print-doc > #app > *{display:none!important}
  body.print-doc > #app > .doc.printing{display:block!important}
  .bar,.snav{position:static}
  .doc{color:#181818}
  .doc-hd{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #e6e6e6;
    padding-bottom:5mm; margin-bottom:8mm}
  .doc-hd svg{height:6mm; width:auto; color:#0013e9}
  .doc-hd span{font-size:8.5pt; color:#646464}
  .doc h1{font-size:24pt; margin-bottom:3mm}
  .doc h2{font-size:13pt; letter-spacing:-.02em; margin:7mm 0 2.5mm; color:#0013e9}
  .doc p,.doc li{font-size:10pt; line-height:1.5; color:#333}
  .doc ul{padding-left:4.5mm; margin:0}
  .doc li{margin-bottom:1.2mm}
  .doc table{width:100%; border-collapse:collapse; font-size:9.5pt; margin-top:2mm}
  .doc td,.doc th{border-bottom:.5pt solid #e6e6e6; padding:2mm 0; text-align:left; font-weight:400; vertical-align:top}
  .doc th{color:#646464; width:45%}
  .doc .note{font-size:8pt; color:#646464; margin-top:6mm}
  .doc .cols{display:grid; grid-template-columns:1fr 1fr; gap:8mm}
  .doc section{break-inside:avoid}
}

<script>
(function(){
  'use strict';
  var S = JSON.parse(document.getElementById('sealed').textContent);
  var LOGO = document.querySelector('.gate-logo').innerHTML;
  var enc = new TextEncoder();
  var KEY = 'biolyz-client:' + S.slug;
  var RAW = null;

  function hex2b(h){ var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function b2hex(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function cat(){ var n = 0, i, o; for (i = 0; i < arguments.length; i++) n += arguments[i].length;
    var out = new Uint8Array(n); for (i = 0, o = 0; i < arguments.length; i++){ out.set(arguments[i], o); o += arguments[i].length; } return out; }

  async function derive(pass){
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      {name:'PBKDF2', hash:'SHA-256', salt:hex2b(S.salt), iterations:S.iter}, base, 256));
  }
  async function open(raw){
    var k = await crypto.subtle.importKey('raw', raw, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    if (b2hex(await crypto.subtle.sign('HMAC', k, enc.encode('biolyz-client-verify'))) !== S.verify) return null;
    RAW = raw;
    return JSON.parse(new TextDecoder().decode(await unseal(S.slug, S.c, S.t)));
  }
  // label || 0x01 || block keystream, label || 0x02 || cipher tag; zlib inside.
  async function unseal(name, c, t){
    var k = await crypto.subtle.importKey('raw', RAW, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    var mac = function(d){ return crypto.subtle.sign('HMAC', k, d); };
    var label = enc.encode(name);
    var ct = Uint8Array.from(atob(c), function(x){ return x.charCodeAt(0); });
    if (b2hex(await mac(cat(label, [2], ct))) !== t) throw new Error('tag');
    var blocks = Math.ceil(ct.length / 32), jobs = [];
    for (var i = 0; i < blocks; i++){
      var ctr = new Uint8Array(8), v = i;
      for (var j = 7; j >= 0; j--){ ctr[j] = v & 255; v = Math.floor(v / 256); }
      jobs.push(mac(cat(label, [1], ctr)));
    }
    var stream = await Promise.all(jobs), pt = new Uint8Array(ct.length);
    for (i = 0; i < ct.length; i++) pt[i] = ct[i] ^ new Uint8Array(stream[i >> 5])[i & 31];
    var ds = new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(ds).arrayBuffer());
  }

  var msg = document.getElementById('gate-msg');
  async function unlock(raw, quiet){
    try {
      var page = await open(raw);
      if (!page){ if (!quiet){ msg.textContent = 'That password is not right.'; msg.className = 'gate-msg err'; } return false; }
      try { sessionStorage.setItem(KEY, b2hex(raw)); } catch (e) {}
      show(page);
      return true;
    } catch (e) {
      msg.textContent = 'The page could not be opened. Please use an up-to-date browser.';
      msg.className = 'gate-msg err';
      return false;
    }
  }
  document.getElementById('gate-form').addEventListener('submit', async function(ev){
    ev.preventDefault();
    msg.textContent = 'Opening …'; msg.className = 'gate-msg';
    unlock(await derive(document.getElementById('gate-pass').value), false);
  });
  try { var saved = sessionStorage.getItem(KEY); if (saved) unlock(hex2b(saved), true); } catch (e) {}

  // ---- after unlock -------------------------------------------------------
  function show(page){
    document.title = page.title;
    var app = document.getElementById('app');
    app.innerHTML = page.html.split('__' + 'LOGO__').join(LOGO);   // split so build.py's replace skips it
    document.getElementById('gate').hidden = true;
    app.hidden = false;
    nav(); reveal(); calc(page.data); docs(); files(page.files || {});
    var lock = document.getElementById('lock');
    if (lock) lock.addEventListener('click', function(){ try { sessionStorage.removeItem(KEY); } catch (e) {} location.reload(); });
    if (location.hash){ var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  function nav(){
    var links = [].slice.call(document.querySelectorAll('.snav a'));
    var bar = document.querySelector('.snav');
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (!e.isIntersecting) return;
        links.forEach(function(a){
          var on = a.getAttribute('href') === '#' + e.target.id;
          a.classList.toggle('on', on);
          if (on && bar) bar.scrollTo({left:a.offsetLeft - 16, behavior:'smooth'});
        });
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    links.forEach(function(a){ var s = document.querySelector(a.getAttribute('href')); if (s) io.observe(s); });
  }

  function reveal(){
    var els = [].slice.call(document.querySelectorAll('.rv'));
    if (!('IntersectionObserver' in window)){ els.forEach(function(e){ e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -8% 0px'});
    els.forEach(function(e){ io.observe(e); });
  }

  // ---- pricing calculator ----------------------------------------------------
  var fmt = new Intl.NumberFormat('en-GB', {maximumFractionDigits:0});
  var one = new Intl.NumberFormat('en-GB', {maximumFractionDigits:1});
  var eur = function(n){ return '€' + fmt.format(Math.round(n)); };
  var mio = function(n){ return '€' + new Intl.NumberFormat('en-GB', {maximumFractionDigits:2}).format(n / 1e6) + 'm'; };
  var pct = function(n){ return new Intl.NumberFormat('en-GB', {maximumFractionDigits:n < 1 ? 2 : 1}).format(n) + '%'; };
  var STATE = {};

  function calc(D){
    var root = document.getElementById('calc');
    if (!root || !D) return;
    var st = STATE = {pkg:D.packages[D.defaultPackage || 0], weeks:D.weeks, salary:D.salaries[0].value, out:D.outWeeks || 3,
                      on:{}};
    D.squad.forEach(function(p){ st.on[p.no + p.name] = true; });

    var pk = root.querySelector('[data-pkgs]');
    pk.innerHTML = D.packages.map(function(p, i){
      return '<button type="button" class="pkg" data-i="' + i + '"><span class="pn">' + p.name + '</span>' +
        '<span class="pp">' + eur(p.price) + ' <span class="pd">per player per week</span></span><span class="pd">' + p.desc + '</span></button>';
    }).join('');
    var sq = root.querySelector('[data-squad]');
    var groups = {};
    D.squad.forEach(function(p){ (groups[p.pos] = groups[p.pos] || []).push(p); });
    sq.innerHTML = Object.keys(groups).map(function(g){
      return '<div><div class="squad-pos">' + g + '</div><div class="squad-row">' + groups[g].map(function(p){
        return '<button type="button" class="pl-chip" aria-pressed="true" data-k="' + p.no + p.name + '">' +
          '<span class="no">' + p.no + '</span>' + p.name + '</button>';
      }).join('') + '</div></div>';
    }).join('');
    var sal = root.querySelector('[data-sal]');
    sal.innerHTML = D.salaries.map(function(s, i){
      return '<button type="button" data-i="' + i + '">' + s.label + '</button>';
    }).join('');

    function $(s){ return root.querySelector(s); }
    function render(){
      var n = D.squad.filter(function(p){ return st.on[p.no + p.name]; }).length;
      var week = n * st.pkg.price, season = week * st.weeks;
      var wkSalary = st.salary / 52;
      var squadCost = st.salary * D.squad.length;
      [].forEach.call(pk.children, function(b){ b.setAttribute('aria-pressed', D.packages[b.dataset.i] === st.pkg); });
      [].forEach.call(sq.querySelectorAll('.pl-chip'), function(b){ b.setAttribute('aria-pressed', !!st.on[b.dataset.k]); });
      [].forEach.call(sal.children, function(b){ b.setAttribute('aria-pressed', D.salaries[b.dataset.i].value === st.salary); });
      $('[data-n]').textContent = n + ' of ' + D.squad.length;
      $('[data-weeks-out]').textContent = st.weeks + ' weeks';
      $('[data-salary-out]').textContent = mio(st.salary) + ' a year';
      $('[data-out-out]').textContent = st.out + (st.out === 1 ? ' week' : ' weeks');
      $('[data-weeks]').value = st.weeks; $('[data-salary]').value = st.salary / 1e5; $('[data-outw]').value = st.out;
      $('[data-season]').textContent = eur(season);
      $('[data-week]').textContent = eur(week);
      $('[data-pp]').textContent = n ? eur(season / n) : '–';
      var share = squadCost ? season / squadCost * 100 : 0;
      $('[data-share]').textContent = pct(share);
      $('[data-meter]').style.width = Math.max(1.5, Math.min(100, share * 10)) + '%';
      $('[data-squadcost]').textContent = mio(squadCost);
      var lost = wkSalary * st.out;
      $('[data-lost]').textContent = eur(lost);
      var be = wkSalary ? season / wkSalary : 0;
      $('[data-be]').textContent = one.format(be);
      $('[data-pkgname]').textContent = st.pkg.name;
      // values the management summary prints
      document.querySelectorAll('[data-sum]').forEach(function(el){
        var k = el.dataset.sum;
        el.textContent = {pkg:st.pkg.name + ' (' + eur(st.pkg.price) + ' per player per week)', n:n + ' players',
          weeks:st.weeks + ' weeks', season:eur(season), share:pct(share) + ' of estimated squad salaries',
          be:one.format(be) + ' player weeks'}[k] || '';
      });
    }
    pk.addEventListener('click', function(e){ var b = e.target.closest('.pkg'); if (b){ st.pkg = D.packages[b.dataset.i]; render(); } });
    sq.addEventListener('click', function(e){ var b = e.target.closest('.pl-chip'); if (b){ st.on[b.dataset.k] = !st.on[b.dataset.k]; render(); } });
    sal.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b){ st.salary = D.salaries[b.dataset.i].value; render(); } });
    root.querySelector('[data-all]').addEventListener('click', function(){ D.squad.forEach(function(p){ st.on[p.no + p.name] = true; }); render(); });
    root.querySelector('[data-none]').addEventListener('click', function(){ D.squad.forEach(function(p){ st.on[p.no + p.name] = false; }); render(); });
    root.querySelector('[data-nogk]').addEventListener('click', function(){ D.squad.forEach(function(p){ st.on[p.no + p.name] = p.pos !== D.squad[0].pos; }); render(); });
    $('[data-weeks]').addEventListener('input', function(e){ st.weeks = +e.target.value; render(); });
    $('[data-salary]').addEventListener('input', function(e){ st.salary = +e.target.value * 1e5; render(); });
    $('[data-outw]').addEventListener('input', function(e){ st.out = +e.target.value; render(); });
    render();
  }

  // ---- sealed downloads: files/<name>.json next to the page, same key ----------
  function files(F){
    var base = location.pathname.replace(/\/?$/, '/') + 'files/';
    document.querySelectorAll('img[data-img]').forEach(async function(img){
      var f = F[img.dataset.img];
      if (!f) return;
      try {
        var j = await (await fetch(base + f.path)).json();
        img.src = URL.createObjectURL(new Blob([await unseal(S.slug + ':' + img.dataset.img, j.c, j.t)], {type:f.type}));
        img.addEventListener('load', function(){ img.classList.add('in'); });
      } catch (e) {}
    });
    document.querySelectorAll('[data-file]').forEach(function(b){
      var f = F[b.dataset.file];
      if (!f){ b.hidden = true; return; }
      b.addEventListener('click', async function(ev){
        ev.preventDefault();
        var label = b.querySelector('.s'), was = label ? label.textContent : '';
        if (label) label.textContent = 'Preparing download …';
        try {
          var j = await (await fetch(base + f.path)).json();
          var blob = new Blob([await unseal(S.slug + ':' + b.dataset.file, j.c, j.t)], {type:f.type});
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = b.dataset.file;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 60000);
          if (label) label.textContent = was;
        } catch (e) { if (label) label.textContent = 'Download failed. Please try again.'; }
      });
    });
  }

  // ---- "PDF" downloads: print one document, the browser saves it as PDF ----------
  function docs(){
    document.querySelectorAll('[data-print]').forEach(function(b){
      b.addEventListener('click', function(){
        var d = document.getElementById(b.dataset.print);
        document.querySelectorAll('.doc').forEach(function(x){ x.classList.toggle('printing', x === d); });
        document.body.classList.add('print-doc');
        var t = document.title; document.title = d.dataset.file || t;
        window.print();
        setTimeout(function(){ document.title = t; document.body.classList.remove('print-doc'); }, 500);
      });
    });
  }
})();
</script>
